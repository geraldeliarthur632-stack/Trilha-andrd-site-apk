<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="45%" stop-color="#4338ca" />
      <stop offset="85%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Golden Star / Beacon Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Trail / Pathway Gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#fcd34d" />
    </linearGradient>

    <!-- Book & Cape Accents -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="bookPageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="beaconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rounded Squircle (App Icon) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Outer Neon Border Ring -->
  <rect x="12" y="12" width="488" height="488" rx="103" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Subtle Constellation Background Lines -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="3 3">
    <line x1="80" y1="120" x2="160" y2="90" />
    <line x1="160" y1="90" x2="256" y2="70" />
    <line x1="256" y1="70" x2="352" y2="90" />
    <line x1="352" y1="90" x2="432" y2="120" />
  </g>

  <!-- THE TRAIL (Trilha do Saber) - Ascending illuminated pathway -->
  <g filter="url(#glowShadow)">
    <!-- Trail Base Glow -->
    <path d="M 120,440 Q 256,410 210,320 T 290,200 Q 256,150 256,110"
          fill="none" stroke="#6366f1" stroke-width="38" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Main Dynamic Trail -->
    <path d="M 130,440 C 230,430 180,330 256,300 C 310,280 230,190 256,110"
          fill="none" stroke="url(#trailGrad)" stroke-width="20" stroke-linecap="round" />

    <!-- Central Trail Dashed Core (Guiding Steps) -->
    <path d="M 130,440 C 230,430 180,330 256,300 C 310,280 230,190 256,110"
          fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-dasharray="14 12" stroke-opacity="0.95" />

    <!-- Trail Milestone Nodes (Waypoints) -->
    <circle cx="150" cy="425" r="9" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="210" cy="345" r="10" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
    <circle cx="275" cy="255" r="11" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />
  </g>

  <!-- OPEN BOOK OF WISDOM (Livro Aberto do Saber) -->
  <g filter="url(#glowShadow)">
    <!-- Book Backing Shadow Layer -->
    <path d="M 256,230 C 210,205 140,200 70,220 L 70,325 C 140,305 210,310 256,335 C 302,310 372,305 442,325 L 442,220 C 372,200 302,205 256,230 Z"
          fill="#1e1b4b" opacity="0.6" />

    <!-- Book Pages Base -->
    <path d="M 256,220 C 212,198 146,194 76,212 L 76,312 C 146,294 212,298 256,320 C 300,298 366,294 436,312 L 436,212 C 366,194 300,198 256,220 Z"
          fill="url(#bookPageGrad)" stroke="#cbd5e1" stroke-width="3" />

    <!-- Left Page Knowledge Lines -->
    <path d="M 110,236 C 145,228 188,231 222,243" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 110,258 C 145,250 188,253 222,265" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M 110,280 C 145,272 188,275 222,287" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Right Page Knowledge Lines -->
    <path d="M 290,243 C 324,231 367,228 402,236" stroke="#818cf8" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 290,265 C 324,253 367,250 402,258" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />
    <path d="M 290,287 C 324,275 367,272 402,280" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" />

    <!-- Book Spine -->
    <path d="M 256,215 L 256,325" stroke="#4338ca" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- BEACON OF WISDOM / NORTH STAR AT THE PEAK (Farol do Saber) -->
  <g filter="url(#beaconGlow)">
    <!-- Central 8-Pointed Star of Knowledge -->
    <!-- Large vertical/horizontal diamond -->
    <path d="M 256,40 L 270,95 L 325,110 L 270,125 L 256,180 L 242,125 L 187,110 L 242,95 Z"
          fill="url(#goldGrad)" stroke="#ffffff" stroke-width="3" />

    <!-- Diagonal smaller sparks -->
    <path d="M 256,110 L 285,80 L 256,110 L 285,140 L 256,110 L 227,140 L 256,110 L 227,80 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Core Shining Sphere -->
    <circle cx="256" cy="110" r="13" fill="#ffffff" />
    <circle cx="256" cy="110" r="7" fill="#fbbf24" />
  </g>

  <!-- Sparkles & Small Stars -->
  <polygon points="100,105 105,117 117,122 105,127 100,139 95,127 83,122 95,117" fill="url(#goldGrad)" />
  <polygon points="410,100 414,110 424,114 414,118 410,128 406,118 396,114 406,110" fill="url(#goldGrad)" />
  <polygon points="390,380 394,388 402,391 394,394 390,402 386,394 378,391 386,388" fill="url(#goldGrad)" />
  <polygon points="90,380 94,388 102,391 94,394 90,402 86,394 78,391 86,388" fill="#38bdf8" />
</svg>
